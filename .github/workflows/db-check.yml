# PR·push마다 임시 PostgreSQL 18에서 database/ 패키지를 자동 검증
# 엔티티 컴파일 → 마이그레이션 → 엔티티-DB 차이 없음 → 연동 테스트 21개 + Stage Quiz HTTP → SQL 제약 테스트 86개 → ai 스키마(pgvector) 8개 → ai RAG·벡터 테이블 20개
name: db-check
on:
  pull_request:
  push:
    branches: [main, develop, test]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18   # PostgreSQL 18 + pgvector (RDS와 같은 메이저 버전)
        env:
          POSTGRES_USER: leren_admin
          POSTGRES_PASSWORD: admin_ci
          POSTGRES_DB: leren
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leren_admin -d leren"
          --health-interval 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: leren
      DB_USER: app_user
      DB_PASSWORD: app_local
      DB_MIGRATION_USER: migrator
      DB_MIGRATION_PASSWORD: migrator_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 1. 스키마·계정 생성 (app + ai + ai RAG·벡터 테이블)
        run: |
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -v ON_ERROR_STOP=1 -f database/sql/init/01_app_schema.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -v ON_ERROR_STOP=1 -f database/sql/init/02_ai_schema.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -v ON_ERROR_STOP=1 -f database/sql/init/03_ai_tables.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -v ON_ERROR_STOP=1 -f database/sql/init/04_ai_vector_table.sql
      - name: 2. 컴파일 (strict)
        run: npm run db:build
      - name: 3. 마이그레이션 실행 (migrator)
        run: npm run db:migrate
      - name: 4. 엔티티-DB 차이 없음 확인
        run: npm run db:check
      - name: 5. 엔티티 연동 테스트 21개 (app_user)
        run: npm run db:test
      - name: 5-1. 일반 Stage Quiz HTTP 계약 (실제 Express·PostgreSQL)
        env:
          LEREN_EXTENDED_API_PG_TEST_CONFIG: '{"port":5432,"database":"leren","username":"app_user","password":"app_local"}'
        run: npm run test:stage-quiz:contract
      - name: 6. SQL 제약 테스트 86개 (빈 DB에 마이그레이션 후 app_user로 실행)
        run: |
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -c "CREATE DATABASE leren_sql"
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren_sql -v ON_ERROR_STOP=1 -f database/sql/init/01_app_schema.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren_sql -v ON_ERROR_STOP=1 -f database/sql/init/02_ai_schema.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren_sql -v ON_ERROR_STOP=1 -f database/sql/init/03_ai_tables.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren_sql -v ON_ERROR_STOP=1 -f database/sql/init/04_ai_vector_table.sql
          DB_NAME=leren_sql npm run db:migrate
          PGPASSWORD=app_local psql -h localhost -U app_user -d leren_sql -f database/sql/test/constraint_test.sql | tee sql-test.log
          grep -q "TOTAL 86/86" sql-test.log
      - name: 7. ai 스키마 검증 8개 (pgvector·권한 분리, ai_user로 실행)
        run: |
          PGPASSWORD=ai_local psql -h localhost -U ai_user -d leren_sql -f database/sql/test/ai_schema_test.sql | tee ai-test.log
          grep -q "TOTAL 8/8" ai-test.log
      - name: 7-1. ai RAG·벡터 테이블 검증 20개 (03·04, ai_user로 실행)
        run: |
          PGPASSWORD=ai_local psql -h localhost -U ai_user -d leren_sql -f database/sql/test/ai_tables_test.sql | tee ai-tables-test.log
          grep -q "TOTAL 20/20" ai-tables-test.log
      - name: 8. 서버가 database 패키지를 불러오는지 확인
        run: node -e "const db=require('@leren/database'); if(db.entities.length!==47 || !db.entities.includes(db.KakaoOAuthEntry)) throw new Error('Unexpected entity registration'); console.log('entities', db.entities.length)"
