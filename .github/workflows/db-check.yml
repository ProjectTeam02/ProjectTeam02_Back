# PR·push마다 임시 PostgreSQL 18에서 database/ 패키지를 자동 검증
# 엔티티 컴파일 → 마이그레이션 → 엔티티-DB 차이 없음 → 연동 테스트 21개 + Stage Quiz HTTP → SQL 제약 테스트 105개 → ai 스키마(pgvector) 8개 → ai RAG·벡터 테이블 21개
name: db-check
on:
  pull_request:
  push:
    branches: [main, develop, test]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18   # PostgreSQL 18 + pgvector (RDS와 같은 메이저 버전)
        env:
          POSTGRES_USER: leren_admin
          POSTGRES_PASSWORD: admin_ci
          POSTGRES_DB: leren
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leren_admin -d leren"
          --health-interval 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: leren
      DB_USER: app_user
      DB_PASSWORD: app_local
      DB_MIGRATION_USER: migrator
      DB_MIGRATION_PASSWORD: migrator_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 웹·모바일 카카오와 Refresh Token (격리 PostgreSQL)
        run: pwsh -NoProfile -File test/integration/run-kakao-postgres.ps1
      - name: 1. 스키마·계정 생성 (app + ai + ai RAG·벡터 테이블)
        run: |
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -v ON_ERROR_STOP=1 -f database/sql/init/01_app_schema.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -v ON_ERROR_STOP=1 -f database/sql/init/02_ai_schema.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -v ON_ERROR_STOP=1 -f database/sql/init/03_ai_tables.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -v ON_ERROR_STOP=1 -f database/sql/init/04_ai_vector_table.sql
      - name: 2. 컴파일 (strict)
        run: npm run db:build
      - name: 3. 마이그레이션 실행 (migrator)
        run: npm run db:migrate
      - name: 4. 엔티티-DB 차이 없음 확인
        run: npm run db:check
      - name: 5. 엔티티 연동 테스트 21개 (app_user)
        run: npm run db:test
      - name: MVP 콘텐츠 사전 검사와 퀴즈·알림 HTTP 계약 (격리 PostgreSQL)
        env:
          PGPASSWORD: admin_ci
          LEREN_PREFLIGHT_PG_TEST_CONFIG: '{"port":5432,"password":"app_local"}'
          LEREN_MVP_API_PG_TEST_CONFIG: '{"port":5432,"database":"leren_mvp_verify","password":"app_local"}'
        run: |
          for fixture in mvp_preflight_fresh mvp_preflight_fixture leren_mvp_verify; do
            createdb -h localhost -U leren_admin "$fixture"
          done
          for fixture in mvp_preflight_fixture leren_mvp_verify; do
            psql -h localhost -U leren_admin -d "$fixture" -v ON_ERROR_STOP=1 -f database/sql/init/01_app_schema.sql
            DB_NAME="$fixture" npm run db:migrate
          done
          PGPASSWORD=app_local psql -h localhost -U app_user -d leren_mvp_verify -v ON_ERROR_STOP=1 -f database/sql/seed/01_master_data.sql
          node --test test/integration/mvp-content-preflight-postgres.test.js test/integration/mvp-quiz-content-notification-postgres.test.js
      - name: 5-1. 일반 Stage와 Boss Quiz HTTP 계약 (실제 Express·PostgreSQL)
        env:
          LEREN_EXTENDED_API_PG_TEST_CONFIG: '{"port":5432,"database":"leren","username":"app_user","password":"app_local"}'
        run: npm run test:stage-quiz:contract
      - name: 5-1a. 오답 자동 수집과 복습 공개 계약 (실제 Express·PostgreSQL)
        env:
          LEREN_EXTENDED_API_PG_TEST_CONFIG: '{"port":5432,"database":"leren","username":"app_user","password":"app_local"}'
        run: npm run test:wrong-answer-collection:pg
      - name: 5-2. 학습 알림 대상·중복 방지 (실제 PostgreSQL)
        env:
          LEREN_EXTENDED_API_PG_TEST_CONFIG: '{"port":5432,"database":"leren","username":"app_user","password":"app_local"}'
        run: npm run test:push-reminder:pg
      - name: 5-3. 학습 응시 명시적 포기 (실제 Express·PostgreSQL)
        env:
          LEREN_EXTENDED_API_PG_TEST_CONFIG: '{"port":5432,"database":"leren","username":"app_user","password":"app_local"}'
        run: npm run test:attempt-abandon:pg
      - name: 6. SQL 제약 테스트 105개 (빈 DB에 마이그레이션 후 app_user로 실행)
        run: |
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren -c "CREATE DATABASE leren_sql"
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren_sql -v ON_ERROR_STOP=1 -f database/sql/init/01_app_schema.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren_sql -v ON_ERROR_STOP=1 -f database/sql/init/02_ai_schema.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren_sql -v ON_ERROR_STOP=1 -f database/sql/init/03_ai_tables.sql
          PGPASSWORD=admin_ci psql -h localhost -U leren_admin -d leren_sql -v ON_ERROR_STOP=1 -f database/sql/init/04_ai_vector_table.sql
          DB_NAME=leren_sql npm run db:migrate
          PGPASSWORD=app_local psql -h localhost -U app_user -d leren_sql -f database/sql/test/constraint_test.sql | tee sql-test.log
          grep -q "TOTAL 105/105" sql-test.log
      - name: 학습 이력 날짜 필터와 개념별 정답률 (실제 PostgreSQL)
        env:
          LEREN_EXTENDED_API_PG_TEST_CONFIG: '{"port":5432,"database":"leren","username":"app_user","password":"app_local"}'
        run: node --test test/integration/learning-history-accuracy-postgres.test.js
      - name: 7. ai 스키마 검증 8개 (pgvector·권한 분리, ai_user로 실행)
        run: |
          PGPASSWORD=ai_local psql -h localhost -U ai_user -d leren_sql -f database/sql/test/ai_schema_test.sql | tee ai-test.log
          grep -q "TOTAL 8/8" ai-test.log
      - name: 7-1. ai RAG·벡터 테이블 검증 21개 (03·04, ai_user로 실행)
        run: |
          PGPASSWORD=ai_local psql -h localhost -U ai_user -d leren_sql -f database/sql/test/ai_tables_test.sql | tee ai-tables-test.log
          grep -q "TOTAL 21/21" ai-tables-test.log
      - name: 상점 구매·재화·장착 정합성 (실제 PostgreSQL)
        env:
          LEREN_EXTENDED_API_PG_TEST_CONFIG: '{"port":5432,"database":"leren","username":"app_user","password":"app_local"}'
        run: node --test test/integration/shop-inventory-postgres.test.js
      - name: 기존 코스튬·장착·구매 데이터의 OUTFIT 이관
        env:
          PGPASSWORD: admin_ci
          LEREN_COSTUME_MIGRATION_PG_TEST_CONFIG: '{"port":5432,"database":"leren_costume_upgrade","password":"migrator_local"}'
        run: |
          createdb -h localhost -U leren_admin leren_costume_upgrade
          psql -h localhost -U leren_admin -d leren_costume_upgrade -v ON_ERROR_STOP=1 -f database/sql/init/01_app_schema.sql
          node --test test/integration/costume-outfit-migration-postgres.test.js
      - name: 기존 사용자에게 직업 기본 한벌옷 지급
        env:
          PGPASSWORD: admin_ci
          LEREN_CLASS_DEFAULT_COSTUME_PG_TEST_CONFIG: '{"port":5432,"database":"leren_class_default_upgrade","password":"migrator_local"}'
        run: |
          createdb -h localhost -U leren_admin leren_class_default_upgrade
          psql -h localhost -U leren_admin -d leren_class_default_upgrade -v ON_ERROR_STOP=1 -f database/sql/init/01_app_schema.sql
          node --test test/integration/class-default-costume-migration-postgres.test.js
      - name: 8. 서버가 database 패키지를 불러오는지 확인
        run: node -e "const db=require('@leren/database'); if(db.entities.length!==49 || !db.entities.includes(db.KakaoOAuthEntry) || !db.entities.includes(db.BossAttemptQuestion)) throw new Error('Unexpected entity registration'); console.log('entities', db.entities.length)"
