name: CI

on:
  push:
    branches: [main, develop, test]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 문항 생성 (Docker PostgreSQL 및 Mock FastAPI)
        run: npm run test:question-generation:pg
