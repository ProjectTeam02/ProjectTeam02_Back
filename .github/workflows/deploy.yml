# 운영 이미지 빌드·배포
# - main에 머지되면: ARM64 이미지 빌드 → ECR leren-backend:<커밋 12자리> 푸시
# - 수동 실행(Actions → deploy → Run workflow)
#     action=build  : 선택한 브랜치(main)의 이미지만 빌드·푸시
#     action=deploy : SSM으로 태그 leren-deploy=app 인 EC2에서 deploy/deploy.sh 실행
# - AWS 인증은 OIDC(장기 키 없음). production 환경(main만 허용)에서만 실행됩니다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "build = 이미지 빌드·푸시만 / deploy = EC2에 배포"
        type: choice
        options: [build, deploy]
        default: build
      backend_tag:
        description: "(deploy) 백엔드 이미지 태그. 비우면 이 실행의 커밋 12자리"
        required: false
        default: ""
      ai_tag:
        description: "(deploy) AI 이미지 태그. current = 서버에서 실행 중인 태그 유지"
        required: false
        default: current

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 955094290134.dkr.ecr.ap-northeast-2.amazonaws.com
  OPS_BUCKET: leren-ops-955094290134

jobs:
  build:
    if: github.event_name == 'push' || inputs.action == 'build'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: 이미지 태그 (커밋 12자리)
        id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: OIDC 주체(sub) 확인 — AWS 신뢰 정책과 비교용 (토큰 자체는 출력하지 않음)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="$P="; done
          echo "$P" | base64 -d | jq -r '"sub=" + .sub'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: 같은 태그가 이미 있으면 건너뛰기 (태그 덮어쓰기 불가 설정)
        id: exists
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name leren-backend --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "이미 있음: leren-backend:$TAG"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ARM64 빌드 준비 (EC2 t4g = ARM)
        if: steps.exists.outputs.skip == 'false'
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use --name leren-builder

      - name: 빌드·푸시 (linux/arm64)
        if: steps.exists.outputs.skip == 'false'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
            -t "$ECR_REGISTRY/leren-backend:$TAG" --push .
          echo "### 푸시 완료: leren-backend:$TAG" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 태그 확인 (형식 검사, ECR에 이미지가 있는지)
        id: tags
        env:
          IN_BACKEND: ${{ inputs.backend_tag }}
          IN_AI: ${{ inputs.ai_tag }}
        run: |
          B=${IN_BACKEND:-$(git rev-parse --short=12 HEAD)}
          A=${IN_AI:-current}
          for t in "$B" "$A"; do
            [[ "$t" =~ ^([0-9a-f]{7,40}|current)$ ]] || { echo "태그 형식이 잘못됐어요: $t"; exit 1; }
          done
          if [ "$B" != current ]; then
            aws ecr describe-images --repository-name leren-backend --image-ids imageTag="$B" > /dev/null \
              || { echo "ECR에 leren-backend:$B 가 없어요 (먼저 build)"; exit 1; }
          fi
          if [ "$A" != current ]; then
            aws ecr describe-images --repository-name leren-ai --image-ids imageTag="$A" > /dev/null \
              || { echo "ECR에 leren-ai:$A 가 없어요"; exit 1; }
          fi
          echo "backend=$B" >> "$GITHUB_OUTPUT"
          echo "ai=$A" >> "$GITHUB_OUTPUT"

      - name: 배포 대상 EC2 찾기 (태그 leren-deploy=app, 실행 중, 1대)
        id: target
        run: |
          IDS=$(aws ec2 describe-instances \
            --filters Name=tag:leren-deploy,Values=app Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          [ -n "$IDS" ] || { echo "leren-deploy=app 태그가 붙은 실행 중인 EC2가 없어요"; exit 1; }
          [ "$(wc -w <<< "$IDS")" -eq 1 ] || { echo "대상이 1대가 아니에요: $IDS"; exit 1; }
          echo "id=$IDS" >> "$GITHUB_OUTPUT"

      - name: 배포 파일 업로드 (S3, EC2가 내려받음)
        id: files
        run: |
          KEY="deploy/$GITHUB_SHA"
          aws s3 cp deploy/docker-compose.prod.yml "s3://$OPS_BUCKET/$KEY/docker-compose.prod.yml"
          aws s3 cp deploy/deploy.sh "s3://$OPS_BUCKET/$KEY/deploy.sh"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: SSM으로 EC2에서 deploy.sh 실행
        env:
          INSTANCE_ID: ${{ steps.target.outputs.id }}
          KEY: ${{ steps.files.outputs.key }}
          B: ${{ steps.tags.outputs.backend }}
          A: ${{ steps.tags.outputs.ai }}
        run: |
          CMD="set -e; mkdir -p /opt/leren/deploy"
          CMD="$CMD; aws s3 cp s3://$OPS_BUCKET/$KEY/docker-compose.prod.yml /opt/leren/deploy/ --region $AWS_REGION --only-show-errors"
          CMD="$CMD; aws s3 cp s3://$OPS_BUCKET/$KEY/deploy.sh /opt/leren/deploy/ --region $AWS_REGION --only-show-errors"
          CMD="$CMD; bash /opt/leren/deploy/deploy.sh $B $A"
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy backend=$B ai=$A" \
            --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c], executionTimeout:["1200"]}')" \
            --query Command.CommandId --output text)
          echo "SSM 명령 ID: $CID"
          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "### 배포 결과: $STATUS (backend=$B, ai=$A)" >> "$GITHUB_STEP_SUMMARY"
          test "$STATUS" = Success
